[project]
name = "khutat"
version = "0.1.0"
description = "مولّد خطط الحلقات القرآنية — يعبّئ بيانات الطالبات على قوالب الجمعية"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.0",
    "reportlab>=4.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
